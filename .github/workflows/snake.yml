name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # runs once a day
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: bakhtiarsiddiqui
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ff006e,%238338ec,%233a86ff&color_dots=%231a1a2e,%238338ec33,%238338ec66,%238338ec99,%23ff006e
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23ff006e,%238338ec,%233a86ff&color_dots=%231a1a2e,%238338ec33,%238338ec66,%238338ec99,%23ff006e

      - name: Push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
